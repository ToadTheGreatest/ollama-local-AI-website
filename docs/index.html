<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalAI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Base / Reset styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        /* Standard flex layout */
        html, body {
            height: 100%;
            background-color: #212121;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }

        /* 1. Standard approach for Firefox */
        html {
            overflow-y: scroll;               /* Ensures the scroll area always exists */
            scrollbar-width: thin;            /* Makes the scroll blob skinny */
            scrollbar-color: #888 transparent; /* thumb color | track color */
        }

        /* 2. WebKit approach for Chrome, Safari, Edge, and Opera */
        html::-webkit-scrollbar {
            width: 8px;                       /* Width of the vertical scrollbar space */
            height: 8px;                      /* Height of the horizontal scrollbar space */
        }

        html::-webkit-scrollbar-track {
            background: transparent;          /* Makes the background bar completely invisible */
        }

        html::-webkit-scrollbar-thumb {
            background-color: #888;         /* Color of your scroll blob */
            border-radius: 10px;              /* Rounds the edges into a blob shape */
        }

        /* Optional: Darkens the blob slightly when you hover over it */
        html::-webkit-scrollbar-thumb:hover {
            background-color: #555; 
        }

        /* 1. Messages Container */
        #messages-container {
            width: 50rem; /* Match this to your .prompt-wrapper width (or make it smaller like 45rem) */
            max-width: 100%;
            flex: 1;
            overflow-y: auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease-in-out, padding 0.5s ease;
        }

        body.chat-active #messages-container {
            visibility: visible;
            opacity: 1;
            padding: 1.5rem 1rem;
        }

        /* 2. Bottom Prompt Box (The Magic Animation) */
        .prompt-wrapper {
            width: 50rem;
            max-width: 100%;
            padding: 0.5rem 1rem 1rem 1rem;
            /* Initially pushes the prompt box up to the vertical center of the screen */
            transform: translateY(-38vh); 
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 5;
        }

        body.chat-active .prompt-wrapper {
            /* Glides smoothly down to its normal bottom position */
            transform: translateY(0); 
        }

        .message-user {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }
        .message-user .bubble {
            max-width: 70%;
            background-color: #2f2f2f;
            color: #ffffff;
            padding: 0.75rem 1.25rem;
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message-ai {
            display: flex;
            justify-content: flex-start;
            width: 100%;
        }
        .message-ai .bubble {
            max-width: 85%;
            color: #ececec;
            padding: 0.75rem 0.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* Markdown Styling inside AI Bubbles */
        .message-ai .bubble pre {
            background-color: #1e1e1e;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 0.5rem 0;
            overflow-x: auto;
        }
        .message-ai .bubble code {
            font-family: monospace;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
        }
        .message-ai .bubble pre code {
            background-color: transparent;
            padding: 0;
        }
        .message-ai .bubble ul, .message-ai .bubble ol {
            margin-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        /* Thinking text */
        #thinkingtext {
            font-size: 0.875rem;
            color: #9ca3af;
            height: 1.5rem;
        }

        #main-form {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #2f2f2f;
            border-radius: 1.5rem;
            border: 1px solid #424242;
            padding: 0.6rem 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }
        #main-form:focus-within {
            border-color: #676767;
        }

        /* Textarea Input */
        #user-input {
            width: 100%;
            flex: 1;
            min-width: 0;
            background: transparent;
            color: #f3f4f6;
            border: none;
            outline: none;
            resize: none;
            font-size: 1rem;
            padding: 0.25rem;
            max-height: 13rem;
            font-family: inherit;
        }
        #user-input::placeholder {
            color: #9ca3af;
        }

        /* Model Dropdown */
        #model-select {
            background-color: #212121;
            color: #d1d5db;
            font-size: 0.875rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            padding: 0.4rem 0.6rem;
            border-radius: 0.75rem;
            border: 1px solid #424242;
            transition: border-color 0.2s;
            flex-shrink: 0;
        }
        #model-select:hover {
            border-color: #676767;
        }

        /* Send Button */
        #send-button {
            padding: 0.5rem;
            border-radius: 9999px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }
        #send-button:hover {
            opacity: 0.8;
        }
        #send-button:disabled {
            opacity: 0.3;
        }

        /* Footer version info */
        .footer-info {
            font-size: 0.75rem;
            color: #6b7280;
            padding-bottom: 0.5rem;
        }
        .footer-info a {
            color: inherit;
            text-decoration: underline;
        }
        .footer-info a:hover {
            color: #9ca3af;
        }
        .title {
            top: 15px;
            left: 15px;
            position: absolute;
            color: #8c8c8c;
            text-align: left;
            z-index: 10;
        }
        a {
            color: #8c8c8c;
        }
        .offline-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #dc2626; /* Red warning background */
            color: #ffffff;
            text-align: center;
            padding: 0.75rem;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .offline-banner.hidden {
            transform: translateY(-100%); /* Slides out of view when online */
        }

        /* Dim/Lock styling when input is disabled */
        #user-input:disabled, #send-button:disabled, #model-select:disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }
    </style>
</head>
<body class="h-full bg-[#212121] text-gray-100 flex flex-col items-center justify-between font-sans antialiased">
    <div id="offline-banner" class="offline-banner hidden">
        Ollama is offline. Make sure Ollama is running.
    </div>
    <span class="title"><b>Local AI</b><br><a href="https://github.com/ToadTheGreatest/ollama-local-AI-website">Github</a></span>
    <!-- 1. MESSAGES CONTAINER -->
    <div id="messages-container">
        <!-- Messages will be injected here dynamically -->
    </div>

    <span id="thinkingtext"></span>

    <!-- 2. BOTTOM PROMPT BOX -->
    <div class="prompt-wrapper">
        <form id="main-form">
            <!-- Prompt Input Textarea -->
            <textarea 
                id="user-input"
                rows="1" 
                placeholder="Message LocalAI..."
            ></textarea>

            <!-- Model Dropdown (Right side, before send button) -->
            <select id="model-select" title="Select Model">
                <option value="qwen2.5:3b" style="background-color: #2f2f2f; color: #ececec;">qwen2.5:3b</option>
            </select>

            <!-- Send Button -->
            <button type="submit" id="send-button" title="Send message">
                <svg style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5L12 3m0 0l7.5 7.5M12 3v18"/>
                </svg>
            </button>
        </form>
    </div>

    <div class="footer-info">
        Version 1.2 By <a href="https://github.com/ToadTheGreatest" target="_blank">ToadTheGreatest</a>
    </div>    <script>
        const history = [
            {
                "role": "user",
                "content": "(SYSTEM INFO): Here is some info about this chat interface for reference if the user asks about the chat interface. 1). It supports Markdown. 2). It supports model interchanging. 3). It is fully local. 4). It has a github page (clean redirect to github.com/ToadTheGreatest/ollama-local-AI-website) 5). The layout was inspired by Google Gemini and OpenAI's ChatGPT website. 6). The chat interface is fully message based."
            }
        ];

        async function chat(prompt, onTokenCallback) {
            text = prompt;
            if (!text) return;
            history.push({ role: 'user', content: text });
            try {
                var model = document.getElementById("model-select").value
                if (model) {
                    if (!model === "/install") {
                        const response = await fetch('http://localhost:11434/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                model: model, // Make sure this matches `ollama list`
                                messages: history,
                                stream: true
                            })
                        });
                        if (!response.ok) {
                            history.pop(); // Remove the unsent user prompt from history
                            console.log(`\nOllama Error: ${data.error}`);
                            return "*Error: Ollama failed! Please try again.*";
                        }
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();

                        let assistantMessage = { role: 'assistant', content: '' }
                        history.push(assistantMessage)

                        let  buffer = ''

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            buffer += decoder.decode(value, { stream:true });
                            let lines = buffer.split("\n")
                            buffer = lines.pop();
                            for (const line of lines) {
                                if (line.trim() === '') continue;
                                const data = JSON.parse(line)
                                if (data.error) {
                                    history.pop();
                                    console.log(`\nOllama Error: ${data.error}`)
                                    if (onTokenCallback) {
                                        onTokenCallback("*Ollama response error! Please try again.*")
                                    }
                                    return "*Ollama response error! Please try again.*"
                                }
                                if (data.message && data.message.content) {
                                    const contentChunk = data.message.content;
                                    assistantMessage.content += contentChunk
                                    if (onTokenCallback) {
                                        onTokenCallback(assistantMessage.content)
                                    }
                                }
                            }
                        }
                    } else if (model === "/install") {
                        const payload = {
                            model: prompt,
                            stream: false
                        };
                        outputtext = `*Starting model download for ${prompt}*\n`;
                        if (onTokenCallback) {
                            onTokenCallback(outputtext);
                        }
                        try {
                            const response = await fetch("http://localhost:11434/api/pull", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify(payload)
                            });
                            if (!response.ok) {
                                outputtext += "*Error: Model download failed! does the model exist? are you connected to the internet?*\n";
                                if (onTokenCallback) {
                                    onTokenCallback(outputtext);
                                }
                                return;
                            }
                            const data = await response.json();
                            outputtext += "*Download success!*\n";
                            if (onTokenCallback) {
                                onTokenCallback(outputtext);
                            }
                            checkOllamaStatus();
                        } catch {
                            outputtext += "*Error: Model download failed! does the model exist? are you connected to the internet?*\n";
                            if (onTokenCallback) {
                                onTokenCallback(outputtext);
                            }
                            return;
                        }
                    }
                } else {
                    if (onTokenCallback) {
                        onTokenCallback("*Error: no model selected*")
                    }
                    return "*Error: no model selected*"
                }
            } catch (err) {
                checkOllamaStatus();
                if (onTokenCallback) {
                    onTokenCallback(`*Error: Ollama handoff failed! Is Ollama on?*`)
                }
                return `*Error: Ollama handoff failed! Is Ollama on?*`;
            }
        }

        function addMessage(mtext, sender) {
            const messagesContainer = document.getElementById("messages-container")
            if (messagesContainer.children.length === 0) {
                document.body.classList.add('chat-active');
            }
            const container = document.createElement('div');
            container.className = sender === "user" ? 'message-user' : 'message-ai';
            const bubble = document.createElement('div');
            bubble.className = "bubble";
            if (sender === "user") {
                bubble.textContent = mtext;
            } else {
                bubble.innerHTML = marked.parse(mtext || "");
            }
            container.appendChild(bubble);
            messagesContainer.appendChild(container);
            scrollToBottom(true);
            return bubble;
        }

        async function sendToAI(prompt) {
            var model = document.getElementById("model-select").value
            if (model == "/install") {
                document.getElementById("thinkingtext").textContent = "Installing...";
            } else {
                document.getElementById("thinkingtext").textContent = "Thinking...";
            }
            addMessage(prompt, "user");
            const aiBubble = addMessage("", "ai");
            await chat(prompt, (accumulatedText) => {
                aiBubble.innerHTML = marked.parse(accumulatedText);
                scrollToBottom(false);
            });
            document.getElementById("thinkingtext").textContent = "";
            addCopyButtonsToCodeBlocks(document.getElementById("messages-container"))
        }

        function go() {
            var prompt = document.getElementById("user-input").value;
            document.getElementById("user-input").value = "";
            sendToAI(prompt);
        }

        async function checkOllamaStatus() {
            const ollamaUrl = 'http://localhost:11434/api/tags';
            const select = document.getElementById('model-select');

            try {
                const response = await fetch(ollamaUrl, {
                    method: 'GET',
                });

                if (response.ok) {
                    onlineunlock();
                    const data = await response.json();
                    console.log('Ollama is running. Available models:', data.models);
                    
                    select.innerHTML = '';
                    if (data.models && data.models.length > 0) {
                        data.models.forEach(model => {
                            const option = document.createElement('option');
                            option.value = model.name;
                            option.textContent = model.name;
                            option.className = "bg-[#2f2f2f] text-gray-200";
                            select.appendChild(option);
                        });
                    } else {
                        const option = document.createElement('option');
                        option.value = '';
                        option.textContent = 'No models available';
                        option.className = "bg-[#2f2f2f] text-gray-200";
                        select.appendChild(option);
                    }
                    const option = document.createElement('option');
                    option.value = '/install';
                    option.textContent = '[Install Model]';
                    option.className = "bg-[#2f2f2f] text-gray-200";
                    select.appendChild(option);
                    return true;
                } else {
                    offlinelock();
                    console.warn('Ollama responded with status:', response.status);
                    select.innerHTML = '<option value="">No models available</option>';
                    setTimeout(checkOllamaStatus,5000)
                    return false;
                }
            } catch (error) {
                offlinelock();
                console.error('Ollama is offline or unreachable:', error.message);
                select.innerHTML = '<option value="">No models available</option>';
                setTimeout(checkOllamaStatus,5000)
                return false;
            }
        }
        function offlinelock() {
            document.getElementById("offline-banner").classList.remove("hidden")
            document.getElementById("user-input").disabled = true;
            document.getElementById("send-button").disabled = true;
            document.getElementById("model-select").disabled = true;
        }
        function onlineunlock() {
            document.getElementById("offline-banner").classList.add("hidden")
            document.getElementById("user-input").disabled = false;
            document.getElementById("send-button").disabled = false;
            document.getElementById("model-select").disabled = false;
        }

        function scrollToBottom(force = false) {
            const container = document.getElementById("messages-container");
            const threshold = 100;
            const distanceToBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
            if (force || distanceToBottom <= threshold) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function addCopyButtonsToCodeBlocks(element) {
            const preBlocks = element.querySelectorAll('pre');

            preBlocks.forEach(pre => {
                // 1. Check if it contains a <code> tag
                const codeBlock = pre.querySelector('code');
                
                // 2. Skip if there's no <code> block or if a copy button already exists
                if (!codeBlock || pre.querySelector('.copy-btn')) return;

                pre.style.position = 'relative';

                const copyButton = document.createElement('button');
                copyButton.textContent = 'Copy';
                copyButton.className = 'copy-btn';
                copyButton.style.position = 'absolute';
                copyButton.style.top = '0.5rem';
                copyButton.style.right = '0.5rem';
                copyButton.style.padding = '0.25rem 0.5rem';
                copyButton.style.fontSize = '0.75rem';
                copyButton.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                copyButton.style.color = '#ececec';
                copyButton.style.border = '1px solid rgba(255, 255, 255, 0.1)';
                copyButton.style.borderRadius = '0.25rem';
                copyButton.style.cursor = 'pointer';
                copyButton.style.transition = 'background-color 0.2s';

                copyButton.addEventListener('click', () => {
                    const textToCopy = codeBlock.innerText;

                    navigator.clipboard.writeText(textToCopy)
                        .then(() => {
                            copyButton.textContent = 'Copied!';
                            setTimeout(() => {
                                copyButton.textContent = 'Copy';
                            }, 2000);
                        })
                        .catch(err => {
                            console.error('Error copying text:', err);
                        });
                });

                pre.appendChild(copyButton);
            });
        }

        // Run check status / load models on page load
        window.addEventListener('DOMContentLoaded', () => {
            checkOllamaStatus();
        });

        var cancelSend = false;

        document.getElementById("main-form").addEventListener('submit', function(e) {
            e.preventDefault();
            if (document.getElementById("user-input").value.trim()) {
                go();
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key == "Enter") {
                if (!cancelSend) {
                    e.preventDefault();
                    if (document.getElementById("user-input").value.trim()) {
                        go();
                    }
                }
            }
            if (e.key == "Shift") {
                cancelSend = true;
            }
        });

        document.addEventListener('keyup', e => {
            if (e.key == "Shift") {
                cancelSend = false;
            }
        });
    </script>
</body>
</html>
